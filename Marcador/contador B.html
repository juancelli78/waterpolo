<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>MARCADOR</title>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body
    ontouchstart="touchStart(event)"
    ontouchmove="touchMove(event)"
    ontouchend="touchEnd(event)"
    onclick="clickDesktop(event)"
    class="rojo"
  >
    <!-- CONTROLES DE COLOR -->
    <div id="controlesColor" onclick="detenerClickMarcador(event)">
      <label class="controlColor">
        <span>F</span>
        <input
          type="color"
          id="colorFondo"
          value="#d50000"
          onchange="cambiarFondo(this.value)"
        />
      </label>

      <label class="controlColor">
        <span>N</span>
        <input
          type="color"
          id="colorNumero"
          value="#ffffff"
          onchange="cambiarNumero(this.value)"
        />
      </label>
    </div>

    <!-- MARCADOR -->
    <div id="contador">0</div>

    <script src="marcador.js"></script>
  </body>
</html>
