<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cronómetro WaterPolo</title>
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <!-- ========================================= -->
    <!-- PANTALLA DE CONFIGURACIÓN -->
    <!-- ========================================= -->
    <div id="pantallaConfiguracion">
      <h1>CONFIGURACIÓN</h1>
      <div id="codigoConfiguracion"></div>
      <div class="configContainer">
        <div class="columna">
          <h2>CUARTOS</h2>
          <div class="fila">
            <label>1º Cuarto</label>
            <input id="q1" type="number" min="1" max="99" value="8" />
          </div>
          <div class="fila">
            <label>2º Cuarto</label>
            <input id="q2" type="number" min="1" max="99" value="8" />
          </div>
          <div class="fila">
            <label>3º Cuarto</label>
            <input id="q3" type="number" min="1" max="99" value="8" />
          </div>
          <div class="fila">
            <label>4º Cuarto</label>
            <input id="q4" type="number" min="1" max="99" value="8" />
          </div>
        </div>
        <div class="columna">
          <h2>DESCANSOS</h2>
          <div class="fila">
            <label>1 - 2</label>
            <input id="d1" type="number" min="0" max="99" value="2" />
          </div>
          <div class="fila">
            <label>2 - 3</label>
            <input id="d2" type="number" min="0" max="99" value="3" />
          </div>
          <div class="fila">
            <label>3 - 4</label>
            <input id="d3" type="number" min="0" max="99" value="2" />
          </div>
        </div>
      </div>
      <button id="btnIniciar">INICIAR PARTIDO</button>
    </div>
    <!-- ========================================= -->
    <!-- PANTALLA LOADING -->
    <!-- ========================================= -->
    <div id="pantallaLoading">
      <div class="loadingTexto">CONECTANDO</div>
      <div class="spinner"></div>
      <div id="loadingEstado">ESPERANDO SUPABASE...</div>
    </div>
    <!-- ========================================= -->
    <!-- PANTALLA CRONÓMETRO -->
    <!-- ========================================= -->
    <div id="pantallaCronometro" style="display: none">
      <!-- CÓDIGO DEL PARTIDO -->
      <div id="codigoCronometro">
        <span id="codigoTexto"></span>
      </div>
      <!-- ESTADO SUPABASE -->
      <div id="estadoConexion">SUPABASE ✓</div>
      <!-- PERÍODO -->
      <div id="periodo">PERÍODO 1</div>
      <!-- CRONÓMETRO -->
      <div id="cronometro">
        <span id="mm">08</span>
        <span id="dp">:</span>
        <span id="ss">00</span>
      </div>
      <!-- ESTADO -->
      <div id="estado">ESPERANDO AL CONTROL...</div>
      <!-- BOTÓN DE RECONEXIÓN -->
      <button id="btnReconectar" style="display: none">RECONECTAR</button>
    </div>
    <script src="app26.js"></script>
  </body>
</html>
